# 로컬 개발: docker compose up --build
# 배포(스웜): ./build.sh && ./deploy.sh (내부적으로 docker stack deploy 를 씀)
#
# nginx 만 호스트에 포트를 열고, ingest-worker/backend 는 스택 내부 네트워크에서만
# 보인다 (nginx/nginx.conf 가 서비스명으로 라우팅한다).
services:
  ingest-worker:
    build: ./ingest-worker
    image: ${INGEST_WORKER_IMAGE:-scene-stealer-back-ingest-worker:latest}
    environment:
      PORT: 8080
      STORAGE_DIR: /data/segments
      MAX_SEGMENT_BYTES: ${MAX_SEGMENT_BYTES:-262144000}
      DEVICE_TOKENS: ${DEVICE_TOKENS}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      # 카메라 상태가 바뀌면 backend 로 알려 SSE 로 흘린다 (요구사항 2.4).
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      BACKEND_INTERNAL_URL: http://backend:8081
    volumes:
      - ingest_segments:/data/segments
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
      resources:
        limits:
          memory: 512M

  ai-worker:
    build: ./ai-worker
    image: ${AI_WORKER_IMAGE:-scene-stealer-back-ai-worker:latest}
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      POLL_INTERVAL_SEC: ${AI_WORKER_POLL_INTERVAL_SEC:-5}
      POSE_MODEL: ${AI_WORKER_POSE_MODEL:-yolo11n-pose.pt}
      ANOMALY_WINDOW_FRAMES: ${AI_WORKER_ANOMALY_WINDOW_FRAMES:-32}
      ANOMALY_STRIDE_FRAMES: ${AI_WORKER_ANOMALY_STRIDE_FRAMES:-8}
      ANOMALY_THRESHOLD_STD: ${AI_WORKER_ANOMALY_THRESHOLD_STD:-2.5}
      ANOMALY_MIN_SEGMENT_FRAMES: ${AI_WORKER_ANOMALY_MIN_SEGMENT_FRAMES:-16}
      WORK_DIR: /app/tmp
    volumes:
      - ai_worker_tmp:/app/tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
      resources:
        limits:
          memory: 2G

  backend:
    build: ./backend
    image: ${BACKEND_IMAGE:-scene-stealer-back-backend:latest}
    environment:
      PORT: 8081
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      # backend 가 Supabase 를 내부 주소로 부를 때 서명 URL 을 바꿔 줄 공개 주소 (app/config.py).
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL:-}
      SIGNED_URL_TTL_SEC: ${SIGNED_URL_TTL_SEC:-3600}
      # ingest-worker 가 /internal/* 를 부를 때 대조하는 공유 비밀값.
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      # ai-worker 가 남긴 anomaly_events 를 위험 이벤트로 옮기는 주기 (app/anomaly_ingest.py).
      ANOMALY_POLL_SEC: ${ANOMALY_POLL_SEC:-5}
      # 없으면 푸시를 보내지 않고 로그만 남긴다 (app/push.py).
      FCM_SERVER_KEY: ${FCM_SERVER_KEY:-}
      # 영업시간·수면시간 판정은 매장 벽시계 기준이다.
      STORE_TIMEZONE: ${STORE_TIMEZONE:-Asia/Seoul}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
      resources:
        limits:
          memory: 256M

  nginx:
    build: ./nginx
    image: ${NGINX_IMAGE:-scene-stealer-back-nginx:latest}
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
    depends_on:
      - ingest-worker
      - backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0

volumes:
  ingest_segments:
  ai_worker_tmp:
