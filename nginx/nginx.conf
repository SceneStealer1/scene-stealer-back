# 127.0.0.11 은 도커 임베디드 DNS. 서비스가 아직 안 떠 있어도 nginx 가 기동에 실패하지
# 않도록 proxy_pass 를 변수로 둬서 요청이 올 때마다 재조회하게 한다 (정적 proxy_pass 는
# 설정 로드 시점에 한 번만 resolve 해서, 상대 서비스가 늦게 뜨면 nginx 자체가 죽는다).
resolver 127.0.0.11 valid=10s;

server {
    listen 80;

    # cctv-agent-electron 이 보내는 5분 조각(메인스트림 기준 최대 ~150MB)이 여유 있게
    # 통과하도록 잡은 값. ingest-worker 의 MAX_SEGMENT_BYTES 와 같이 맞춰서 바꿀 것.
    client_max_body_size 300m;

    # ai-worker / ingest-worker 가 backend 를 부르는 내부 전용 경로.
    # 스택 내부 네트워크에서 서비스명으로 직접 부르므로 외부에서는 닿을 이유가
    # 없다. backend 쪽에도 공유 토큰 검사가 있지만(app/routers/stream.py),
    # 애초에 문을 열어 두지 않는다.
    location /internal/ {
        return 404;
    }

    # cctv-agent-electron 의 업로드 계약 (docs/protocol-flow.md 5절) — 고정 경로.
    location /v1/segments {
        set $ingest_upstream ingest-worker:8080;
        proxy_pass http://$ingest_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 영상 파일을 nginx 가 통째로 버퍼링하지 않고 그대로 흘려보낸다.
        proxy_request_buffering off;
    }

    # PC 하트비트 + 카메라 상태 보고 (요구사항 7.1 · 2.4). 기기 토큰으로 인증하는
    # 에이전트 전용 경로라 backend 가 아니라 ingest-worker 가 받는다 —
    # 하트비트가 들고 오는 카메라 상태를 조각 업로드와 같은 토큰으로 처리한다.
    location /v1/devices/ {
        set $ingest_upstream_hb ingest-worker:8080;
        proxy_pass http://$ingest_upstream_hb;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE 실시간 채널 (요구사항 4.2). 기본 설정이면 nginx 가 응답을 모아뒀다
    # 흘려서 실시간이 아니게 되고, 60초 기본 read timeout 에 연결이 끊긴다.
    # 정규식 location 이라 아래 `location /` 보다 먼저 매칭된다.
    location ~ ^/stores/[^/]+/stream$ {
        set $backend_sse backend:8081;
        proxy_pass http://$backend_sse;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        # 앱이 15초마다 ping 을 보내지만, 그보다 넉넉히 잡아 둔다.
        proxy_read_timeout 1h;
    }

    # 그 외 전부는 백엔드 API로. backend 가 앞으로 늘어날 엔드포인트를 다 받는다.
    location / {
        set $backend_upstream backend:8081;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
