# 127.0.0.11 은 도커 임베디드 DNS. 서비스가 아직 안 떠 있어도 nginx 가 기동에 실패하지
# 않도록 proxy_pass 를 변수로 둬서 요청이 올 때마다 재조회하게 한다 (정적 proxy_pass 는
# 설정 로드 시점에 한 번만 resolve 해서, 상대 서비스가 늦게 뜨면 nginx 자체가 죽는다).
resolver 127.0.0.11 valid=10s;

# 인증서 파일(더미든 실제든)이 없으면 nginx 자체가 기동 실패한다 — 그래서 최초 배포
# 전에 certbot/init-cert.sh 로 더미 인증서를 먼저 만들어둬야 한다. 자세한 흐름은
# certbot/README.md 참고. (로컬 전체 실행은 scripts/local-up.sh 가 자체서명 인증서를 만든다.)
ssl_certificate     /etc/letsencrypt/live/api.scene-stealer.site/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/api.scene-stealer.site/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers HIGH:!aNULL:!MD5;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 10m;

# 80 과 443 은 같은 경로를 같은 곳으로 보낸다. 한쪽만 고치면 http 로 붙은 매장 PC 와
# https 로 붙은 웹 체험판이 서로 다르게 동작하니, 경로를 바꿀 때는 두 server 를 같이 고친다.

server {
    listen 80;
    server_name api.scene-stealer.site;

    # cctv-agent-electron 이 보내는 5분 조각(메인스트림 기준 최대 ~150MB)이 여유 있게
    # 통과하도록 잡은 값. ingest-worker 의 MAX_SEGMENT_BYTES 와 같이 맞춰서 바꿀 것.
    client_max_body_size 300m;

    # certbot 이 도메인 소유를 증명하기 위해 쓰는 경로. certbot_www 볼륨을 nginx/certbot
    # 컨테이너가 같이 마운트해서 파일을 주고받는다 (certbot/README.md 참고).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ai-worker / ingest-worker 가 backend 를 부르는 내부 전용 경로.
    # 스택 내부 네트워크에서 서비스명으로 직접 부르므로 외부에서는 닿을 이유가
    # 없다. backend 쪽에도 공유 토큰 검사가 있지만(app/routers/stream.py),
    # 애초에 문을 열어 두지 않는다.
    location /internal/ {
        return 404;
    }

    # cctv-agent-electron 의 업로드 계약 (docs/protocol-flow.md 5절) — 고정 경로.
    # 인증서가 준비되기 전이거나, 아직 http로 남아있는 에이전트를 위해 80도 계속 그대로
    # 서비스한다. 모든 에이전트가 https로 옮기고 나면 아래 location 들을 지우고
    # `return 301 https://$host$request_uri;` 로 바꿔서 http를 강제 리다이렉트할 것.
    location /v1/segments {
        set $ingest_upstream ingest-worker:8080;
        proxy_pass http://$ingest_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 영상 파일을 nginx 가 통째로 버퍼링하지 않고 그대로 흘려보낸다.
        proxy_request_buffering off;
    }

    # PC 하트비트 + 카메라 상태 보고 (요구사항 7.1 · 2.4). 기기 토큰으로 인증하는
    # 에이전트 전용 경로라 backend 가 아니라 ingest-worker 가 받는다 —
    # 하트비트가 들고 오는 카메라 상태를 조각 업로드와 같은 토큰으로 처리한다.
    location /v1/devices/ {
        set $ingest_upstream_hb ingest-worker:8080;
        proxy_pass http://$ingest_upstream_hb;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE 실시간 채널 (요구사항 4.2). 기본 설정이면 nginx 가 응답을 모아뒀다
    # 흘려서 실시간이 아니게 되고, 60초 기본 read timeout 에 연결이 끊긴다.
    # 정규식 location 이라 아래 `location /` 보다 먼저 매칭된다.
    location ~ ^/stores/[^/]+/stream$ {
        set $backend_sse backend:8081;
        proxy_pass http://$backend_sse;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        # 앱이 15초마다 ping 을 보내지만, 그보다 넉넉히 잡아 둔다.
        proxy_read_timeout 1h;
    }

    # 그 외 전부는 백엔드 API로. backend 가 앞으로 늘어날 엔드포인트를 다 받는다.
    location / {
        set $backend_upstream backend:8081;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.scene-stealer.site;

    client_max_body_size 300m;

    location /internal/ {
        return 404;
    }

    location /v1/segments {
        set $ingest_upstream ingest-worker:8080;
        proxy_pass http://$ingest_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }

    location /v1/devices/ {
        set $ingest_upstream_hb ingest-worker:8080;
        proxy_pass http://$ingest_upstream_hb;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/stores/[^/]+/stream$ {
        set $backend_sse backend:8081;
        proxy_pass http://$backend_sse;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        set $backend_upstream backend:8081;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
